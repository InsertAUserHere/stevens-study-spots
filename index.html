<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Spots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#2b1519;--mute:#7b6468;--red:#a6192e;--tint:#fbe3e7;--line:#ecd9dc;--free:#4e9a5b;--use:#d9483f;--clean:#e39a2d;
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1012;--card:#26171a;--ink:#f8ecee;--mute:#c2a4a9;--red:#e0566b;--tint:#45202a;--line:#4a2d33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1012;--card:#26171a;--ink:#f8ecee;--mute:#c2a4a9;--red:#e0566b;--tint:#45202a;--line:#4a2d33;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.top{background:#a6192e;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px}.top h1{max-width:480px;margin:0 auto}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip.sm{padding:7px 14px;font-size:14px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,sans-serif}
.app{max-width:480px;margin:0 auto;padding:6px 18px 110px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;font-weight:700}
h1{font-size:30px}h2{font-size:26px;margin:14px 0 2px}h3{font-size:22px;margin:22px 0 8px}
p.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 1px 4px rgba(166,25,46,.08)}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.free{background:var(--free)}.use{background:var(--use)}.clean{background:var(--clean)}.class{background:var(--red)}
.name{font-weight:600}.meta{color:var(--mute);font-size:14px}
button,select,input,textarea{font:inherit;color:var(--ink)}
.btn{background:var(--red);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn.big{width:100%;padding:14px;font-size:17px}.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--red);border:1.5px solid var(--red);padding:8px 14px}
.field{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:13px 18px;margin-bottom:10px}
textarea.field{border-radius:22px;min-height:84px;resize:vertical}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.chip,.slot,.seg button{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:12px 14px;font-weight:500;cursor:pointer}
.chip.on,.slot.on{background:var(--tint);border-color:var(--red);color:var(--red)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{padding:14px 0;text-align:center}.slot:disabled{opacity:.4;text-decoration:line-through;cursor:default}
.seg{display:flex;background:var(--card);border-radius:999px;padding:5px;margin-bottom:12px;gap:4px}
.seg button{flex:1;border:0;background:transparent}.seg button.on{background:var(--bg);color:var(--red);font-weight:600}
.mapwrap{background:var(--card);border-radius:22px;padding:8px;position:relative}
svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 4px;font-size:14px}.legend span{display:flex;align-items:center;gap:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;color:var(--mute);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--red);font-weight:600}nav b{font-size:20px;line-height:1}
.tag{display:inline-block;background:var(--bg);border-radius:999px;padding:2px 10px;font-size:13px;margin:6px 6px 0 0}
.pin{cursor:pointer}.mscroll{overflow:auto;max-height:62vh;border-radius:16px}.zm{display:flex;gap:8px;justify-content:flex-end;margin:2px 4px 8px}.zm .btn{padding:4px 16px;font-size:18px}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><h1>Campus Spots</h1></header>

 </div>`}
function spots(){const F=['Outlets','Quiet','Wi‑Fi','Whiteboard','Food nearby'];
 return `<h2>Study spots</h2><p class="sub">Tap “I’m here” when you sit down so others know it’s taken. Check-ins clear after 2 hours.</p><div class="fl">${F.map(f=>`<button class="chip sm ${S.sf.includes(f)?'on':''}" data-a="sflt" data-v="${f}">${f}</button>`).join('')}</div>`+SP.map((p,i)=>({...p,i})).filter(p=>S.sf.every(f=>p.f.includes(f))).map(p=>{const i=p.i,s=st(i),mine=S.use[i]&&S.use[i]>Date.now();return`<div class="card row"><i class="dot ${s}"></i><div class="grow"><div class="name">${p.n}</div><div class="meta">${BL[p.b].n} · ${lab[s]}</div>${tg(p.f)}</div>${mine?`<button class="btn ghost" data-a="leave" data-v="${i}">I’m leaving</button>`:`<button class="btn" data-a="here" data-v="${i}" ${s!=='free'?'disabled':''}>I’m here</button>`}</div>`}).join('')||'<p class="sub">No spots match those features.</p>'}
function report(){
 const T=['Trash / food left behind','Spill or sticky surface','Furniture damaged','Needs general cleaning','Bad internet','Other issue'];
 const open=S.rep.map((r,k)=>({...r,k})).filter(r=>!r.done);
 return `<h2>Report a messy space</h2><p class="sub">Let facilities know a study space needs cleaning.</p>
 <select class="field" id="rb">${SP.map((p,i)=>({...p,i})).sort((a,b)=>a.b-b.b).map(p=>`<option value="${p.i}" ${S.rb==p.i?'selected':''}>Bldg ${p.b} — ${BL[p.b].n} — ${p.n}</option>`).join('')}</select>
 <div class="chips">${T.map(t=>`<button class="chip ${S.rt===t?'on':''}" data-a="rt" data-v="${t}">${t}</button>`).join('')}</div>
 <button class="btn big" data-a="sendrep">Send report</button><h3>Open reports</h3>
 ${open.length?open.map(r=>`<div class="card row"><i class="dot clean"></i><div class="grow"><div class="name">${SP[r.i].n}</div><div class="meta">${BL[SP[r.i].b].n} · ${esc(r.t)}</div></div><button class="btn ghost" data-a="cleaned" data-v="${r.k}">Mark cleaned</button></div>`).join(''):'<p class="sub">All clean!</p>'}`}
function reserve(){
 const cls=S.mode==='class',F=['Outlets','Whiteboard','Projector','Quiet','Accessible'];
 const rs=RM.map((r,i)=>({...r,i})).filter(r=>S.f.every(f=>r.f.includes(f))).sort((a,b)=>a.b-b.b||a.r-b.r),r=RM[S.room],ok=rs.some(x=>x.i==S.room);
 const taken=s=>S.res.some(x=>x.room===S.room&&x.date===S.date&&x.slot===s);
 return `<h2>Reserve a classroom</h2><p class="sub">Book a room for a class or grab an unused one as a study space.</p>
 <div class="seg"><button class="${!cls?'on':''}" data-a="mode" data-v="study">Study space</button><button class="${cls?'on':''}" data-a="mode" data-v="class">Class / event</button></div>
 <div class="meta" style="margin:0 4px 6px">Must have</div><div class="fl">${F.map(f=>`<button class="chip sm ${S.f.includes(f)?'on':''}" data-a="flt" data-v="${f}">${f}</button>`).join('')}</div>
 ${rs.length?`<select class="field" id="room">${rs.map(x=>`<option value="${x.i}" ${S.room==x.i?'selected':''}>Bldg ${x.b} — ${BL[x.b].n} — Room ${x.r} (${x.s} seats)</option>`).join('')}</select>
 <div class="card"><div class="name">${BL[r.b].n} · Room ${r.r}</div><div class="meta">${r.s} seats</div>${tg(r.f)}</div>`:`<p class="sub">No rooms have all of those features. Remove a filter to see more.</p>`}
 <input class="field" type="date" id="date" value="${S.date}" aria-label="Date">
 ${cls?`<input class="field" id="evt" placeholder="Class or event name" value="${esc(S.evt)}">`:''}
 <h3 style="margin-top:6px">2-hour slots</h3><div class="slots">${SL.map(s=>`<button class="slot ${S.slot===s?'on':''}" data-a="slot" data-v="${s}" ${taken(s)||!ok?'disabled':''}>${s}:00</button>`).join('')}</div>
 <button class="btn big" style="margin-top:14px" data-a="book" ${S.slot===null||!ok?'disabled':''}>Reserve Room ${r.r}${S.slot!==null?` at ${S.slot}:00`:''}</button>
 <h3>My reservations</h3>${S.res.length?S.res.map((x,k)=>`<div class="card row"><i class="dot class"></i><div class="grow"><div class="name">${BL[RM[x.room].b].n} — Room ${RM[x.room].r}</div><div class="meta">${x.date} · ${x.slot}:00–${x.slot+2}:00 · ${esc(x.kind)}</div></div><button class="btn ghost" data-a="cancel" data-v="${k}">Cancel</button></div>`).join(''):'<p class="sub">Nothing booked yet.</p>'}`}
function access(){
 const bs=Object.keys(BL);
 return `<h2>After-hours ID access</h2><p class="sub">Ask for your ID card to open a building door after it closes.</p>
 <select class="field" id="ab">${bs.map(b=>`<option value="${b}" ${S.ab==b?'selected':''}>Bldg ${b} — ${BL[b].n}</option>`).join('')}</select>
 <div class="row" style="gap:10px"><input class="field" type="date" id="ad" value="${S.ad}" aria-label="Date"><input class="field" type="time" id="at" value="${S.at}" aria-label="Time"></div>
 <textarea class="field" id="aw" placeholder="Why do you need access? (e.g. lab project)">${esc(S.aw)}</textarea>
 <button class="btn big" data-a="req">Request swipe access</button><h3>My requests</h3>
 ${S.acc.length?S.acc.map((x,k)=>`<div class="card"><div class="name">${BL[x.b].n} · ${x.d} at ${x.t}</div><div class="meta">${esc(x.w)}</div><div class="row" style="margin-top:8px"><span class="tag" style="margin:0">Pending approval</span><span class="grow"></span><button class="btn ghost" data-a="wd" data-v="${k}">Withdraw request</button></div></div>`).join(''):'<p class="sub">No requests yet.</p>'}`}
const V={map,report,reserve,access,spots},TABS=[['map','Map','🗺'],['report','Report','⚠'],['reserve','Reserve','📅'],['access','Access','🪪'],['spots','Spots','☆']];
function render(){const m0=document.querySelector('.mscroll'),sx=m0?m0.scrollLeft:0,sy=m0?m0.scrollTop:0;document.getElementById('v').innerHTML=V[S.tab]();const m1=document.querySelector('.mscroll');if(m1){m1.scrollLeft=sx;m1.scrollTop=sy}
 document.getElementById('nav').innerHTML=TABS.map(([k,l,i])=>`<button class="${S.tab===k?'on':''}" data-a="go" data-v="${k}"><b aria-hidden="true">${i}</b>${l}</button>`).join('');}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
 if(a==='go'){S.tab=v;S.slot=null}
 else if(a==='sel')S.sel=S.sel==v?null:v;
 else if(a==='here'){S.use[v]=Date.now()+72e5;save()}
 else if(a==='leave'){delete S.use[v];save()}
 else if(a==='rt')S.rt=v;
 else if(a==='sendrep'){S.rep.push({i:+S.rb,t:S.rt});save()}
 else if(a==='cleaned'){S.rep[v].done=1;save()}
 else if(a==='resv'){S.tab='reserve';S.f=[];S.room=+v;S.slot=null;window.scrollTo(0,0)}
 else if(a==='zi')S.z=Math.min(3,S.z+.25);
 else if(a==='zo')S.z=Math.max(.6,S.z-.25);
 else if(a==='wd'){S.acc.splice(v,1);save()}
 else if(a==='flt'){S.f=S.f.includes(v)?S.f.filter(x=>x!==v):[...S.f,v];const o=RM.map((r,i)=>i).filter(i=>S.f.every(f=>RM[i].f.includes(f)));if(o.length&&!o.includes(S.room))S.room=o[0];S.slot=null}
 else if(a==='sflt')S.sf=S.sf.includes(v)?S.sf.filter(x=>x!==v):[...S.f?S.sf:[],v];
 else if(a==='mode')S.mode=v;
 else if(a==='slot')S.slot=+v;
 else if(a==='book'){S.res.push({room:S.room,date:S.date,slot:S.slot,kind:S.mode==='class'?(S.evt||'Class / event'):'Study space'});S.slot=null;save()}
 else if(a==='cancel'){S.res.splice(v,1);save()}
 else if(a==='req'){S.acc.push({b:S.ab,d:S.ad,t:S.at,w:S.aw||'No reason given'});S.aw='';save()}
 render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.a==='sel')e.target.click()});
document.addEventListener('change',e=>{const m={rb:'rb',room:'room',date:'date',ab:'ab',ad:'ad',at:'at'}[e.target.id];if(m){S[m]=e.target.value;if(m==='room'||m==='date')S.slot=null;render()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.sel=null;const p=e.target.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(p,p)}
 else if(e.target.id==='evt')S.evt=e.target.value;else if(e.target.id==='aw')S.aw=e.target.value});
setInterval(()=>{if(S.tab==='spots'||S.tab==='map')render()},60000);
try{render()}catch(e){document.getElementById('v').innerHTML='<div class="card"><b>Something went wrong loading the app.</b><div class="meta">'+esc(e&&e.message||e)+'</div></div>'}
window.addEventListener('error',function(e){var v=document.getElementById('v');if(v&&!v.innerHTML)v.innerHTML='<div class="card"><b>Error:</b> '+esc(e.message)+'</div>'});
</script>
</body>
</html>
